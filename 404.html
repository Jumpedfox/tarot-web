<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404</title>
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/tarot-web/' +
      '?p=' + l.pathname.replace('/tarot-web/', '').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

</html>
